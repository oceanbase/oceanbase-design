name: Build

on: [pull_request]

jobs:
  build:
    if: github.repository == 'oceanbase/oceanbase-design'
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        node-version: [18.x]
        os: [ubuntu-latest]
      fail-fast: false
    steps:
      - name: Checkout
        uses: actions/checkout@v3
      - uses: actions/setup-node@v3
        with:
          node-version: 18
      - name: Install pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 8.6.0
      - name: Run build
        run: |
          pnpm install
          pnpm run figma:parse
          pnpm run build
          pnpm run test:build
      - name: Figma publish dry-run
        env:
          FIGMA_ACCESS_TOKEN: ${{ secrets.FIGMA_ACCESS_TOKEN }}
          FIGMA_FILE_KEY: ${{ secrets.FIGMA_FILE_KEY }}
        run: |
          if [ -z "${FIGMA_ACCESS_TOKEN:-}" ]; then
            echo "Skipping figma:publish:dry-run (FIGMA_ACCESS_TOKEN not configured)"
            exit 0
          fi
          printf 'FIGMA_ACCESS_TOKEN=%s\nFIGMA_FILE_KEY=%s\n' "$FIGMA_ACCESS_TOKEN" "$FIGMA_FILE_KEY" > .cursor/skills/figma-code-connect/.env
          pnpm run figma:publish:dry-run
