# Current release process:
# 1. `pnpm run publish` will generate new tags and publish to npm
# 4. Then the new tags will trigger this current action
# 5. The action will generate a new release, and publish DingDing notification at the same time
# Manual backfill: Actions → Release Helper → Run workflow → publish_commit_sha

name: Release Helper

on:
  push:
    branches:
      - 'master'
  workflow_dispatch:
    inputs:
      publish_commit_sha:
        description: 'Publish commit SHA to replay (creates GitHub Releases + DingTalk)'
        required: true
        type: string

permissions:
  contents: read

jobs:
  release-helper:
    permissions:
      # local action creates GitHub Releases
      contents: write
    if: ${{ github.event_name == 'workflow_dispatch' || startsWith(github.event.head_commit.message, 'Publish') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # dist/ is gitignored; bundle the local action before use
      - name: Build monorepo-release-helper
        working-directory: .github/actions/monorepo-release-helper
        run: |
          npm install
          npm run package

      - name: Release Oceanbase Design
        # Vendored from dengfuping/monorepo-release-helper (upstream GitHub repo ToS-blocked)
        uses: ./.github/actions/monorepo-release-helper
        with:
          branch: ${{ github.ref_name }}
          commit-sha: ${{ github.event_name == 'workflow_dispatch' && inputs.publish_commit_sha || '' }}
          changelogs: 'docs/design/design-CHANGELOG.md, docs/design/design-CHANGELOG.zh-CN.md, docs/ui/ui-CHANGELOG.md, docs/ui/ui-CHANGELOG.zh-CN.md, docs/charts/charts-CHANGELOG.md, docs/charts/charts-CHANGELOG.zh-CN.md, docs/codemod/codemod-CHANGELOG.md, docs/codemod/codemod-CHANGELOG.zh-CN.md'
          dingding-changelogs: 'docs/design/design-CHANGELOG.zh-CN.md, docs/ui/ui-CHANGELOG.zh-CN.md, docs/charts/charts-CHANGELOG.zh-CN.md, docs/codemod/codemod-CHANGELOG.zh-CN.md'
          dingding-token: ${{ secrets.DINGDING_BOT_TOKEN }}
          dingding-message-title: '# 🎉 OceanBase Design 新版本发布 🎉'
          dingding-message-poster: 'https://gw.alipayobjects.com/mdn/rms_08e378/afts/img/A*zx7LTI_ECSAAAAAAAAAAAABkARQnAQ'
          dingding-message-footer: '🚀 前往 [**OceanBase Design 官网**](https://design.oceanbase.com) 查看示例和用法 \n 🚀 前往 [**OceanBase Design Releases**](https://github.com/oceanbase/oceanbase-design/releases) 查看更新日志 \n 🚀 使用 [**OceanBase Codemod**](https://github.com/oceanbase/oceanbase-design/tree/master/packages/codemod) 进行一键迁移'
          dingding-message-prettier: true
